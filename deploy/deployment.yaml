---
# Namespace: deploy alongside NeuVector but not inside it, so a NeuVector
# upgrade never touches this workload.
apiVersion: v1
kind: Namespace
metadata:
  name: neuvector-mcp
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Controller credentials. Create the API key in NeuVector first:
#   Settings -> API Keys -> Add, role "reader" for read-only deployments.
# Replace both values, or better: manage this Secret with SOPS / External Secrets
# and never commit plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: neuvector-mcp-controller
  namespace: neuvector-mcp
type: Opaque
stringData:
  access-key: REPLACE_ME
  secret-key: REPLACE_ME
---
# Bearer tokens that MCP clients present. Format:
#   <token>,<token2>
# Generate with: openssl rand -hex 32
#
# A token authenticates and does not authorise: every accepted token reaches the
# same tools. Privilege comes from the role on the NeuVector API key above,
# narrowed by NV_READ_ONLY and NV_TOOLSETS below. Two clients needing different
# power means two Deployments with different API keys.
#
# A ':<scope>' suffix is a startup error. It used to be accepted and ignored.
apiVersion: v1
kind: Secret
metadata:
  name: neuvector-mcp-clients
  namespace: neuvector-mcp
type: Opaque
stringData:
  bearer-tokens: "REPLACE_ME_32_BYTE_HEX"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuvector-mcp-config
  namespace: neuvector-mcp
data:
  NV_CONTROLLER_URL: "https://neuvector-svc-controller-api.cattle-neuvector-system.svc:10443"
  NV_VERIFY_TLS: "false"          # controller serves a self-signed cert by default
  NV_AUTH_MODE: "apikey"
  NV_TRANSPORT: "http"
  NV_HTTP_PATH: "/mcp"
  # Write-capable. Every mutating tool still needs the two-step confirm-token
  # handshake below, which is what makes this safe rather than the read-only flag.
  # Flip NV_READ_ONLY to "true" for a deployment that must never write, and cut
  # NV_TOOLSETS back to the five read toolsets to match.
  NV_READ_ONLY: "false"
  NV_TOOLSETS: "inventory,vulnerability,compliance,events,policy_read,policy_write,scan_ops,runtime_ops"
  NV_REQUIRE_CONFIRM_TOKEN: "true"
  NV_MAX_ITEMS: "200"
  NV_MAX_RESPONSE_CHARS: "60000"
  NV_LOG_LEVEL: "INFO"
  NV_LOG_FORMAT: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuvector-mcp
  namespace: neuvector-mcp
  labels:
    app.kubernetes.io/name: neuvector-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuvector-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuvector-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Built in-cluster by deploy/build-job.yaml, which clones main from
          # GitHub and pushes here. Bump both together.
          image: registry.ash4d.com/ash4d-lab/neuvector-mcp:1.1.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: neuvector-mcp-config
          env:
            - name: NV_API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: neuvector-mcp-controller
                  key: access-key
            - name: NV_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neuvector-mcp-controller
                  key: secret-key
            - name: NV_HTTP_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: neuvector-mcp-clients
                  key: bearer-tokens
          ports:
            - name: mcp
              containerPort: 8080
          # The MCP endpoint requires a bearer token, so an unauthenticated HTTP
          # probe would always fail. Probe the socket instead.
          startupProbe:
            tcpSocket: { port: mcp }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 20
          readinessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neuvector-mcp
  namespace: neuvector-mcp
spec:
  selector:
    app.kubernetes.io/name: neuvector-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
# Egress to the controller and DNS only.
#
# Ingress is opt-in: a client reaches :8080 only from a namespace labelled
# neuvector-mcp-client=true, or from a pod in THIS namespace carrying the same
# label. Before this selector existed the rule had no 'from:' at all, which in
# NetworkPolicy means every pod in the cluster, not "the ones that need it".
#
# If you swap in deploy/service-loadbalancer.yaml for off-cluster clients, this
# rule blocks them: traffic arriving from outside the cluster matches no
# namespaceSelector or podSelector. Add an ipBlock for the client CIDR to that
# from: list. Do not delete the selector to make it work -- that reopens :8080
# to every pod in the cluster, and the bearer token becomes the only thing
# standing in front of the controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuvector-mcp
  namespace: neuvector-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neuvector-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              neuvector-mcp-client: "true"
        - podSelector:
            matchLabels:
              neuvector-mcp-client: "true"
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-neuvector-system
      ports:
        - port: 10443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

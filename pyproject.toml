[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuvector-mcp"
version = "1.0.4"
description = "Model Context Protocol server for the SUSE NeuVector container security platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastmcp==3.4.5",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "respx==0.23.1",
  "mypy==1.18.2",
  "ruff==0.14.4",
]

[project.scripts]
neuvector-mcp = "neuvector_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuvector_mcp"]

# --- test ---------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:neuvector_mcp.*"]

[tool.coverage.run]
source = ["neuvector_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# --- lint ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",   # assert is how tests assert
  "N818",   # trailing-underscore error names are deliberate (PermissionError_)
  "B008",   # Field() in Annotated defaults is the FastMCP idiom
  # E501 cannot be enforced against this spec, for three independent reasons:
  #   1. Gate rule R6 parses `Calls <METHOD> <path>` out of every tool docstring
  #      with a regex that requires method+path on ONE physical line. Several
  #      exceed 100 columns and cannot be wrapped without failing the gate.
  #   2. `Field(description=...)` text is the tool contract a client model reads
  #      (SPEC 7.5/7.6). Reflowing it to fit a column limit is a real cost for a
  #      cosmetic gain.
  #   3. The worst offenders are in scripts/verify_spec.py and client.py, which
  #      SPEC N3 requires be kept verbatim -- so zero E501 is unreachable anyway.
  # `ruff format` still wraps everything it safely can; this only silences the
  # residue it cannot split (strings and comments).
  "E501",   # see above -- spec-verbatim docstrings + R6's single-line requirement
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "T201"]
"scripts/**" = ["T201"]
# The entries below are all files SPEC rule N3 requires be kept VERBATIM from
# reference/. They are copied, not authored here, so a lint finding in one of
# them cannot be fixed without violating N3. Scoped per-file (and per-rule) so
# these exemptions never mask the same finding in code we do own.
"scripts/verify_spec.py" = ["T201", "B905"]
"src/neuvector_mcp/client.py" = [
  "S105",    # "_TOKEN_HEADER" is a header NAME, not a credential
  "SIM105",  # try/except/pass on best-effort logout is deliberate
  "SIM108",  # explicit if/else for the ca_bundle/verify_tls precedence reads clearer
]
"src/neuvector_mcp/config.py" = ["S104"]  # 0.0.0.0 is the documented NV_HTTP_HOST default
"src/neuvector_mcp/errors.py" = ["N801"]  # PermissionError_/ValidationError_ avoid shadowing builtins
"tests/conftest.py" = ["C408"]

# --- types --------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false   # FastMCP decorators are untyped upstream

[[tool.mypy.overrides]]
module = ["respx.*", "structlog.*"]
ignore_missing_imports = true

# Same rationale as the ruff per-file-ignores above: these are verbatim copies
# from reference/ under SPEC N3, so their strict-mode findings cannot be fixed
# here. Narrowed to the specific error codes each file actually trips, so a NEW
# class of type error in these modules still fails the build.
[[tool.mypy.overrides]]
module = ["neuvector_mcp.client"]
disable_error_code = ["assignment", "unreachable"]

[[tool.mypy.overrides]]
module = ["neuvector_mcp.context"]
disable_error_code = ["union-attr"]

# verify_spec.py introspects FastMCP's tool objects, which are typed `object`
# upstream; every access is guarded at runtime by the gate's own checks.
[[tool.mypy.overrides]]
module = ["verify_spec"]
disable_error_code = ["attr-defined"]
